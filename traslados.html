<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital de clinicas - Traslado</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css">
</head>
<body>

  <header class="barra">
    <div class="marca">
      <span class="logo">Hospital de Clínicas Montevideo</span>
      <span class="rol-pagina">Chofer</span>
    </div>
    <div class="acciones-barra">
      <a href="Opciones.html" class="volver"><i class="ti ti-arrow-narrow-left"></i> Volver</a>
      <a href="Index.html" class="volver"><i class="ti ti-door-exit"></i> Cerrar sesión</a>
    </div>
  </header>

  <main class="contenido">
    <h1>Panel de Traslado</h1>
    <p class="bajada">
      Viajes asignados, salida y llegada.
    </p>

    <section class="panel-chofer">
      <table class="tabla-func">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Paciente</th>
            <th>Origen</th>
            <th>Destino</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpoTrasladosChofer"></tbody>
      </table>
    </section>
  </main>

  <button class="idioma-flotante">ES</button>

  
  <!-- <script src="../js/traslados.js"></script> -->

</body>
</html>
