        <main>

            <h1>Rutas del circuito nacional</h1>

            <p class="aviso" id="aviso" hidden></p>

            <form action="../../guardar.php?que=ruta" method="POST">

                <p class="ayuda">Hacé clic en el mapa para marcar el punto de salida, y después otro clic para el de llegada.</p>

                <div id="mapa"></div>

                <label>Origen</label>
                <input type="text" name="origen" id="origen" placeholder="Marcalo en el mapa" required>
                <input type="hidden" name="origenLat" id="origenLat">
                <input type="hidden" name="origenLng" id="origenLng">

                <label>Destino</label>
                <input type="text" name="destino" id="destino" placeholder="Marcalo en el mapa" required>
                <input type="hidden" name="destinoLat" id="destinoLat">
                <input type="hidden" name="destinoLng" id="destinoLng">

                <label>Ambulancia asignada</label>
                <select name="ambulancia" id="ambulanciaRuta" required></select>

                <div class="botones">
                    <button type="button" id="limpiar" class="secundario">Volver a marcar</button>
                    <button type="submit">Guardar ruta</button>
                </div>

            </form>

            <div class="tabla">

                <table>

                    <thead>
                        <tr>
                            <th>Origen</th>
                            <th>Destino</th>
                            <th>Ambulancia</th>
                            <th></th>
                        </tr>
                    </thead>

                    <tbody id="cuerpoRutas"></tbody>

                </table>

                <p class="vacio" id="vacio" hidden>Todavía no hay rutas cargadas.</p>

            </div>

        </main>

    </div>
