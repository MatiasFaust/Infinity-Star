        <main>

            <h1>Editar usuario</h1>

            <form action="../../actualizar.php?que=persona" method="POST">

                <input type="hidden" name="id" id="id">

                <label>Rol</label>
                <input type="text" id="rol" disabled>

                <label>Nombre</label>
                <input type="text" name="nombre" id="nombre" required>

                <label>Apellido</label>
                <input type="text" name="apellido" id="apellido" required>

                <label>Cédula</label>
                <input type="text" name="cedula" id="cedula" placeholder="12345678"
                       inputmode="numeric" pattern="[0-9]{8}" maxlength="8"
                       title="La cédula son 8 números, sin puntos ni guión" required>

                <label>Correo</label>
                <input type="email" name="correo" id="correo">

                <label>Dirección</label>
                <input type="text" name="direccion" id="direccion">

                <div class="botones">
                    <a href="usuarios.html">Cancelar</a>
                    <button type="submit">Guardar cambios</button>
                </div>

            </form>

        </main>

    </div>

    <button class="idioma" data-traducciones="../../Js/traducciones.json?v=32">EN</button>
