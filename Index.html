<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>if (localStorage.getItem("tema") == "oscuro") { document.documentElement.className = "oscuro"; }</script>
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="Css/panel.css?v=136">
</head>

<body>

    <header>
        <h3>Hospital de Clínicas Montevideo</h3>

    </header>

    <main class="centro">

        <h1>Iniciar sesión</h1>

        <p class="aviso malo" id="aviso" hidden></p>

        <div class="caja">

            <!-- sinRelleno: deja los campos vacios hasta que la persona los toca,
                 asi Chrome no mete la cuenta que tiene guardada y pisa lo que
                 se escribe. Es el mismo truco que usamos en los buscadores. -->
            <form action="login.php" method="POST" class="sinRelleno" autocomplete="off">

                <label>Usuario</label>
                <input type="text" name="usuario" autocomplete="off" required>

                <label>Contraseña</label>
                <input type="password" name="contrasena" autocomplete="new-password" required>

                <button type="submit">Entrar</button>

            </form>

        </div>

        <p class="ayuda centro">¿No tenés cuenta o no te acordás tus datos? Pedíselo al superadministrador del hospital.</p>

    </main>

    <button class="idioma" data-traducciones="Js/traducciones.json?v=136">EN</button>

    <script src="Js/comun.js?v=136"></script>
</body>

</html>
