<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo TRAS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="pagina">

    <h1>MÓDULO TRAS (TRASLADOS)</h1>

    <div class="modulo">

        <div class="encabezado">

            <div class="datos">
                <div class="persona">♟</div>

                <div>
                    <p class="modulo-texto">MÓDULO</p>
                    <h2>TRAS</h2>
                    <p class="traslados">Traslados</p>
                </div>
            </div>

            <button class="volver">← &nbsp; VOLVER</button>

        </div>


        <div class="menu">

            <div class="titulo-menu">
                <h3>MENÚ TRASLADOS</h3>
                <div class="linea"></div>
            </div>


            <button class="opcion">

                <div class="icono">＋</div>

                <div class="texto">
                    <h4>REGISTRAR TRASLADO</h4>
                    <p>Registrar un nuevo traslado de paciente.</p>
                </div>

                <span class="flecha">›</span>

            </button>


            <button class="opcion">

                <div class="icono lista">
                    • ─<br>
                    • ─<br>
                    • ─
                </div>

                <div class="texto">
                    <h4>VER TRASLADOS</h4>
                    <p>Ver lista de traslados registrados.</p>
                </div>

                <span class="flecha">›</span>

            </button>


            <button class="opcion">

                <div class="icono">✎</div>

                <div class="texto">
                    <h4>MODIFICAR TRASLADO</h4>
                    <p>Editar la información de un traslado.</p>
                </div>

                <span class="flecha">›</span>

            </button>


            <button class="opcion">

                <div class="icono">ⓧ</div>

                <div class="texto">
                    <h4>CANCELAR TRASLADO</h4>
                    <p>Cancelar un traslado registrado.</p>
                </div>

                <span class="flecha">›</span>

            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
